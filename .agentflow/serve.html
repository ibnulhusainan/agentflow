<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentflow viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c1220; --surface:#141c30; --raise:#1b2540; --line:#25304c;
    --text:#e8ecf6; --muted:#8793b0; --accent:#6ea8ff;
    --pending:#8793b0; --progress:#5ac8fa; --review:#ffb454;
    --reopened:#c792ff; --blocked:#ff6b6b; --done:#5fe3a1;
    --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:14px/1.5 var(--body); background:var(--bg); color:var(--text); }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .s-pending{--c:var(--pending)} .s-in_progress{--c:var(--progress)} .s-review{--c:var(--review)}
  .s-reopened{--c:var(--reopened)} .s-blocked{--c:var(--blocked)} .s-completed{--c:var(--done)}

  .bar { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:14px 32px; background:rgba(12,18,32,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .brand { font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:-.02em; }
  .tabs { display:flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; }
  .tab { border:0; background:none; color:var(--muted); padding:7px 18px; border-radius:999px; cursor:pointer; font-weight:500; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--accent); color:#0a1020; }
  .sync { justify-self:end; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--done); }
  .sync.live .dot { animation:pulse 2s ease-in-out infinite; }
  .sync.down .dot { background:var(--blocked); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(95,227,161,.55)} 50%{box-shadow:0 0 0 6px rgba(95,227,161,0)} }

  main { padding:28px 32px 64px; }
  .head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
  h2 { margin:0; font-family:var(--display); font-weight:700; font-size:38px; letter-spacing:-.03em; line-height:1; }
  .head p { margin:0; color:var(--muted); }
  .muted { color:var(--muted); }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .empty { color:var(--muted); padding:22px; text-align:center; border:1px dashed var(--line); border-radius:12px; }

  /* board */
  .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,1fr); gap:16px; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x proximity; }
  .col { scroll-snap-align:start; min-width:0; }
  .colhead { position:relative; padding-top:22px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:baseline; }
  .colhead::before { content:""; position:absolute; top:5px; left:0; right:-16px; height:2px; background:var(--c); opacity:.3; }
  .col:last-child .colhead::before { right:0; }
  .colhead::after { content:""; position:absolute; top:0; left:0; width:12px; height:12px; border-radius:50%; background:var(--c); box-shadow:0 0 0 4px var(--bg); }
  .colhead b { font-family:var(--display); font-size:17px; font-weight:500; }
  .colhead span { font-family:var(--mono); color:var(--c); font-size:13px; }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .card { text-align:left; cursor:pointer; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card:hover { border-color:var(--c); background:var(--raise); }
  .card.sel { border-color:var(--c); box-shadow:0 0 0 1px var(--c); }
  .card .id { font-family:var(--mono); font-size:12.5px; word-break:break-all; display:block; }
  .card .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  .col.s-completed .card { opacity:.65; }
  .col.s-completed .card:hover { opacity:1; }
  .more { color:var(--accent); background:none; border:0; cursor:pointer; padding:4px 2px; text-align:left; }
  .slot { border:1px dashed var(--line); border-radius:10px; padding:14px; color:var(--muted); text-align:center; font-size:12.5px; }

  .badge { --b:var(--c,var(--muted)); display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--b); border:1px solid color-mix(in srgb,var(--b) 45%,transparent); background:color-mix(in srgb,var(--b) 12%,transparent); padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--b); }

  /* models */
  .section-title { margin:32px 0 4px; font-family:var(--display); font-size:15px; font-weight:500; color:var(--accent); }
  .lane { display:grid; grid-template-columns:150px 1fr; gap:8px 24px; padding:20px 0; border-top:1px solid var(--line); }
  .lane h3 { margin:0; font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .lane h3 small { display:block; font:400 12px var(--body); color:var(--muted); margin-top:2px; }
  .relay { display:flex; flex-wrap:wrap; align-items:center; gap:8px 0; }
  .node { font-family:var(--mono); font-size:12px; padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
  .node.free { border-style:dashed; }
  .node.on { color:#0a1020; background:var(--done); border-color:var(--done); font-weight:500; box-shadow:0 0 0 4px rgba(95,227,161,.18); }
  .link { width:22px; height:2px; background:var(--line); flex:none; }
  .gap { margin:0 10px; color:var(--muted); font-size:12px; white-space:nowrap; }

  /* tables */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:11px 16px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12.5px; background:var(--raise); }
  tr:last-child td { border-bottom:0; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:var(--raise); }

  /* modal: native <dialog>, two panes so items get their own reading space */
  dialog { padding:0; border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--text); width:min(70vw,94vw); height:min(740px,88vh); max-width:none; max-height:none; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); }
  dialog[open] { display:flex; flex-direction:column; animation:pop .18s ease-out; }
  dialog::backdrop { background:rgba(5,8,16,.7); backdrop-filter:blur(5px); }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } }
  .mhead { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 24px; border-bottom:1px solid var(--line); flex:none; }
  .mhead .id { font:500 17px var(--mono); word-break:break-all; }
  .mhead .sub { margin-top:6px; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12.5px; }
  .x { background:var(--raise); border:1px solid var(--line); border-radius:8px; width:34px; height:34px; cursor:pointer; flex:none; }
  .x:hover { border-color:var(--accent); }
  .mbody { display:grid; grid-template-columns:400px 1fr; flex:1; min-height:0; }
  .mside { padding:22px 24px; overflow:auto; scrollbar-width: thin; scrollbar-color: var(--muted) var(--bg); background:var(--bg); border-right:1px solid var(--line); }
  .mitems { padding:22px 26px; overflow:auto; scrollbar-width: thin; scrollbar-color: var(--muted) var(--bg); position:relative; }
  .mbody h4 { margin:0 0 12px; font-family:var(--display); font-weight:500; font-size:16px; display:flex; align-items:baseline; gap:10px; }
  .mbody h4 small { font:400 12.5px var(--body); color:var(--muted); }
  .mside h4:not(:first-child) { margin-top:26px; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:8px 12px; }
  .kv > :nth-child(odd) { color:var(--muted); }
  .kv > div { min-width:0; overflow-wrap:anywhere; }
  .meter { margin-bottom:12px; }
  .meter .lbl { display:flex; justify-content:space-between; margin-bottom:5px; }
  .meter .trk { height:8px; background:var(--surface); border-radius:99px; overflow:hidden; }
  .meter .trk i { display:block; height:100%; width:var(--p); background:var(--progress); border-radius:99px; }
  .meter.hot .trk i { background:var(--review); }
  .meter.max .trk i { background:var(--blocked); }
  .item { background:var(--bg); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:10px; padding:11px 15px; margin-bottom:9px; }
  .item.open { border-left-color:var(--review); }
  .item .top { display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; }
  .item .iid { font:500 12.5px var(--mono); color:var(--accent); }
  .item .title { margin-top:6px; line-height:1.55; overflow-wrap:anywhere; }
  .ref { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .ref:hover { color:var(--done); }  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:12px; }

  @media (max-width:820px) {
    .bar { grid-template-columns:1fr auto; padding:12px 16px; }
    .tabs { grid-column:1/-1; order:3; justify-self:stretch; justify-content:space-between; }
    main { padding:22px 16px 48px; }
    .board { grid-auto-columns:82%; }
    .lane { grid-template-columns:1fr; }
    dialog { width:100vw; height:100vh; border-radius:0; }
    .mbody { display:block; overflow:auto; }
    .mside { border-right:0; border-bottom:1px solid var(--line); overflow:visible; }
    .mitems { overflow:visible; }
  }
  @media (prefers-reduced-motion:reduce) { .sync.live .dot{animation:none} dialog[open]{animation:none} }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">agentflow</div>
  <nav class="tabs">
    <button class="tab active" data-view="dashboard">Board</button>
    <button class="tab" data-view="models">Models</button>
    <button class="tab" data-view="knowledge">Knowledge</button>
    <button class="tab" data-view="history">History</button>
  </nav>
  <div class="sync" id="sync"><span class="dot"></span><span id="sync-text">connecting…</span></div>
</header>
<main id="main"><div class="empty">loading…</div></main>
<dialog id="modal" aria-label="Task detail"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLS = [["pending","Pending"],["in_progress","In progress"],["review","Review"],["reopened","Reopened"],["blocked","Blocked"],["completed","Completed"]];
const dlg = $("#modal");
let currentView = "dashboard", selectedTask = null, tasksCache = [], lastSync = 0, online = true, lastSig = "";

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}
const sc = (s) => "s-" + String(s || "").replace(/[^a-z_]/g, "");
const badge = (s) => `<span class="badge ${sc(s)}">${esc(s)}</span>`;

function renderSync() {
  const el = $("#sync"), tx = $("#sync-text");
  el.className = "sync " + (online ? "live" : "down");
  if (!lastSync) { tx.textContent = online ? "connecting…" : "server unreachable"; return; }
  const s = Math.max(0, Math.round((Date.now() - lastSync) / 1000));
  tx.textContent = online ? `synced ${s}s ago` : `server unreachable · last sync ${s}s ago`;
}

async function loadTasks() {
  try {
    const d = await api("/api/tasks");
    tasksCache = (Array.isArray(d.tasks) ? d.tasks : (Array.isArray(d) ? d : [])).filter(Boolean);
    online = true; lastSync = Date.now();
    if (currentView === "dashboard") renderBoard();
    if (selectedTask) selectTask(selectedTask, true);
  } catch (e) { online = false; }
  renderSync();
}

function renderBoard() {
  const known = COLS.map(c => c[0]);
  const extra = [...new Set(tasksCache.map(t => t.status))].filter(s => !known.includes(s)).map(s => [s, s]);
  const running = tasksCache.filter(t => t.status !== "completed").length;
  const card = (t) => `<button class="card ${sc(t.status)}${t.task_id === selectedTask ? " sel" : ""}" data-id="${esc(t.task_id)}">
      <span class="id">${esc(t.task_id)}</span>
      <div class="meta">${esc(t.size || "size n/a")} · plan ${t.plan_required ? "required" : "not required"}</div></button>`;
  $("#main").innerHTML = `
    <div class="head"><h2>Board</h2><p>${running} running · ${tasksCache.length} total</p></div>
    ${tasksCache.length ? `<div class="board">${[...COLS, ...extra].map(([key, label]) => {
      let list = tasksCache.filter(t => t.status === key);
      if (key === "completed") list = list.slice().sort((a, b) => String(b.updated_at || b.created_at || "").localeCompare(String(a.updated_at || a.created_at || "")));
      const shown = key === "completed" ? list.slice(0, 7) : list;
      const hidden = list.length - shown.length;
      return `<section class="col ${sc(key)}">
        <div class="colhead"><b>${esc(label)}</b><span>${list.length}</span></div>
        <div class="stack">${shown.map(card).join("") || '<div class="slot">empty</div>'}
          ${hidden > 0 ? `<button class="more" data-go="history">+${hidden} more in History</button>` : ""}</div></section>`;
    }).join("")}</div>` : '<div class="empty">No tasks yet. Start one from the agent CLI and it shows up here.</div>'}`;
  $$("#main .card").forEach(n => n.addEventListener("click", () => selectTask(n.dataset.id)));
  $$("#main [data-go]").forEach(n => n.addEventListener("click", () => switchView(n.dataset.go)));
}

function meter(label, val, max) {
  const v = Number(val), m = Number(max), ok = Number.isFinite(v) && Number.isFinite(m) && m > 0;
  const r = ok ? v / m : 0, cls = r >= 1 ? "max" : r >= 0.8 ? "hot" : "";
  return `<div class="meter ${cls}"><div class="lbl"><span>${esc(label)}</span><span class="mono">${esc(val ?? "—")} / ${esc(max ?? "—")}</span></div>
    <div class="trk"><i style="--p:${Math.min(100, r * 100)}%"></i></div></div>`;
}

async function selectTask(id, quiet) {
  selectedTask = id;
  let data;
  try { data = await api("/api/task/" + encodeURIComponent(id)); }
  catch (e) { data = { ok:false, error:String(e.message || e) }; }
  if (selectedTask !== id) return; // modal closed or another task picked while loading
  const sig = JSON.stringify(data);
  if (quiet && sig === lastSig) return; // nothing changed: don't reset the reader's scroll
  lastSig = sig;
  const keep = quiet ? $("#mitems") : null, top = keep ? keep.scrollTop : 0;
  renderModal(id, data);
  if (keep) $("#mitems") && ($("#mitems").scrollTop = top);
  if (!dlg.open) dlg.showModal();
  $$(".card").forEach(n => n.classList.toggle("sel", n.dataset.id === id));
}

function renderModal(id, d) {
  const ok = d && d.ok !== false;
  const head = `<div class="mhead"><div><div class="id">${esc(id)}</div>${ok ? `<div class="sub">${badge(d.status)}<span>${esc(d.size || "size n/a")}</span></div>` : ""}</div>
    <button class="x" id="close" aria-label="Close">✕</button></div>`;
  if (!ok) {
    dlg.innerHTML = head + `<div class="mitems"><h4>Couldn't load task</h4><pre>${esc(JSON.stringify(d, null, 2))}</pre></div>`;
  } else {
    const open = Array.isArray(d.open_items) ? d.open_items : [], c = d.counters || {}, b = d.budget;
    const openIds = new Set(open.map(String));
    // d.items = full item list; if the API only gives open_items, show those
    const items = Array.isArray(d.items) ? d.items : open.map(i => ({ id: i }));
    const nOpen = items.filter(i => openIds.has(String(i.id))).length;
    dlg.innerHTML = head + `<div class="mbody">
      <div class="mside">
        <h4>Details</h4>
        <div class="kv">
          <div>Plan required</div><div>${esc(d.plan_required)}</div>
          <div>Next action</div><div>${esc(d.next_action || "—")}</div>
          <div>Open discrepancies</div><div>${(d.open_discrepancies || []).length}</div>
          <div>Verify commands</div><div class="mono">${esc((d.verify_commands || []).join(", ") || "—")}</div>
          <div>Knowledge refs</div><div class="mono">${(d.knowledge_refs || []).map(r => `<span class="ref" onclick="window.openRef('${esc(r).replace(/'/g, "\\\\'")}')">${esc(r)}</span>`).join(", ") || "—"}</div>
        </div>
        <h4>Limits</h4>
        ${meter("Attempts", c.attempts_total, c.max_attempts)}${meter("Spawn depth", c.spawn_depth, c.max_spawn_depth)}${meter("Children", c.children, c.max_children)}
        ${b ? `<h4>Budget</h4><div class="kv"><div>Present</div><div>${esc(b.present)}</div><div>Exceeded</div><div>${(b.exceeded || []).length}</div><div>Warned</div><div>${(b.warned || []).length}</div></div>` : ""}
      </div>
      <div class="mitems" id="mitems">
        <div id="refbox" style="display:none; position:absolute; inset:0; background:var(--surface); z-index:5; padding:22px 26px; overflow:auto;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;">
            <h4 id="ref-title" style="margin:0"></h4>
            <button class="x" onclick="window.closeRef()" aria-label="Close">✕</button>
          </div>
          <div id="ref-body"></div>
        </div>
        <h4>Items <small>${items.length} total · ${nOpen} open</small></h4>
        ${items.length ? items.map(i => {
          const isOpen = openIds.has(String(i.id));
          const refs = (i.knowledge_refs || []).map(r => `<span class="ref" onclick="event.stopPropagation(); window.openRef('${esc(r).replace(/'/g, "\\\\'")}')">${esc(r)}</span>`).join(" ");
          return `<div class="item${isOpen ? " open" : ""}" onclick="window.toggleItem('${esc(i.id)}')">
            <div class="top"><span class="iid">${esc(i.id)}</span>${i.status ? badge(i.status) : ""}${isOpen ? '<span class="badge s-review">open</span>' : ""}</div>
            ${i.title ? `<div class="title">${esc(i.title)}</div>` : ""}
            <div id="item-detail-${esc(i.id)}" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
              <div style="color:var(--muted); font-size:12px; margin-bottom:4px">description:</div>
              <div style="margin-bottom:8px"><ul><li>${(i.description || "—").split(/\. /).filter(Boolean).map(s => esc(s)).join(".</li> <li>")}</li></ul></div>
              <div style="color:var(--muted); font-size:12px; margin-bottom:4px">paths:</div>
              ${(i.paths||[]).map(p => `<div class="mono">${esc(p)}</div>`).join("") || '<div class="muted">—</div>'}
              <div style="color:var(--muted); font-size:12px; margin:6px 0 4px">knowledge refs:</div>
              ${(i.knowledge_refs||[]).map(r => `<div><span class="ref" onclick="event.stopPropagation(); window.openRef('${esc(r).replace(/'/g, "\\\\'")}')">${esc(r)}</span></div>`).join("") || '<div class="muted">—</div>'}
            </div></div>`;
        }).join("") : '<div class="empty">No items</div>'}
      </div>
    </div>`;
  }
  $("#close").addEventListener("click", () => dlg.close());
}

dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // backdrop click
dlg.addEventListener("close", () => { selectedTask = null; lastSig = ""; $$(".card.sel").forEach(n => n.classList.remove("sel")); });

window.toggleItem = function(id) {
  const el = document.getElementById("item-detail-" + id);
  if (el) el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
};
window.openRef = async function(ref) {
  const box = document.getElementById("refbox");
  const body = document.getElementById("ref-body");
  const title = document.getElementById("ref-title");
  if (!box || !body) return;
  box.style.display = "block";
  title.textContent = ref;
  body.innerHTML = '<div class="empty">loading…</div>';
  try {
    const pathPart = ref.split("#")[0];
    const heading = ref.includes("#") ? ref.split("#").slice(1).join("#").trim() : "";
    const data = await api("/api/file?path=" + encodeURIComponent(pathPart));
    if (!data || data.ok === false) { body.innerHTML = `<pre>${esc(JSON.stringify(data))}</pre>`; return; }
    let content = data.content || "";
    if (heading) {
      const lines = content.split("\\n");
      const idx = lines.findIndex(l => l.trim().replace(/^#+\\s*/, "").toLowerCase() === heading.toLowerCase());
      if (idx >= 0) {
        const level = (lines[idx].match(/^#+/) || ["#"])[0].length;
        let end = lines.length;
        for (let i = idx + 1; i < lines.length; i++) {
          const m = lines[i].match(/^(#+)\\s/);
          if (m && m[1].length <= level) { end = i; break; }
        }
        content = lines.slice(idx, end).join("\\n");
      }
    }
    body.innerHTML = `<pre>${esc(content)}</pre>`;
  } catch (e) {
    body.innerHTML = `<pre>${esc(String(e.message || e))}</pre>`;
  }
};
window.closeRef = function() {
  const box = document.getElementById("refbox");
  if (box) box.style.display = "none";
};

async function renderModels() {
  const d = await api("/api/models");
  const adapters = (d.config && d.config.adapters) || {};
  const st = (d.state && d.state.roles) || {};
  const adapterNames = Object.keys(adapters);
  let html = `<div class="head"><h2>Models</h2><p>Each role tries models left to right. The green one is active.</p></div>`;
  if (!adapterNames.length) { $("#main").innerHTML = html + '<div class="empty">No adapters configured</div>'; return; }
  for (const adapter of adapterNames) {
    const roles = (adapters[adapter] && adapters[adapter].roles) || {};
    const names = Object.keys(roles);
    html += `<div class="section-title">${esc(adapter)}</div>`;
    if (!names.length) { html += '<div class="empty">No roles</div>'; continue; }
    html += names.map(role => {
      const info = roles[role] || {}, p = st[adapter + ":" + role];
      const nodes = (tier, list) => (list || []).map((m, i) => {
        const on = p && p.tier === tier && Number(p.index) === i;
        return `<span class="node ${tier}${on ? " on" : ""}">${esc(m)}</span>`;
      }).join('<span class="link"></span>');
      const paid = nodes("paid", info.paid), free = nodes("free", info.free);
      return `<div class="lane"><h3>${esc(role)}<small>${p ? `tier ${esc(p.tier)} · switched ${esc(p.switched_count)}×` : "no state yet"}</small></h3>
        <div class="relay">${paid || '<span class="muted">no paid models</span>'}${free ? `<span class="gap">then free →</span>${free}` : ""}</div></div>`;
    }).join("");
  }
  $("#main").innerHTML = html;
}

async function renderKnowledge() {
  const d = await api("/api/knowledge");
  let body;
  if (d && Array.isArray(d.entries)) {
    body = d.entries.length
      ? `<div class="panel"><table><tr><th>ID</th><th>Status</th><th>Scope</th></tr>${d.entries.map(e =>
          `<tr><td class="mono">${esc(e.id)}</td><td>${esc(e.status)}</td><td class="mono">${esc((e.scope || []).join(", "))}</td></tr>`).join("")}</table></div>`
      : '<div class="empty">No knowledge entries</div>';
  } else body = `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
  $("#main").innerHTML = `<div class="head"><h2>Knowledge</h2></div>${body}`;
}

async function renderHistory() {
  const d = await api("/api/history");
  const tasks = d.tasks || [];
  $("#main").innerHTML = `<div class="head"><h2>History</h2><p>Completed tasks, newest first</p></div>` + (tasks.length
    ? `<div class="panel"><table><tr><th>Task</th><th>Status</th><th>Size</th><th>Updated</th></tr>${tasks.map(t =>
        `<tr class="row" data-id="${esc(t.task_id)}"><td class="mono">${esc(t.task_id)}</td><td>${badge(t.status)}</td><td>${esc(t.size || "")}</td><td class="muted">${esc(t.updated_at || "")}</td></tr>`).join("")}</table></div>`
    : '<div class="empty">No completed tasks yet</div>');
  $$("#main .row").forEach(n => n.addEventListener("click", () => selectTask(n.dataset.id)));
}

async function switchView(view) {
  currentView = view;
  if (dlg.open) dlg.close();
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  try {
    if (view === "dashboard") renderBoard();
    else if (view === "models") await renderModels();
    else if (view === "knowledge") await renderKnowledge();
    else if (view === "history") await renderHistory();
  } catch (e) {
    $("#main").innerHTML = `<div class="head"><h2>Error</h2></div><pre>${esc(e.message || e)}</pre>`;
  }
}

$$(".tab").forEach(t => t.addEventListener("click", () => switchView(t.dataset.view)));
loadTasks();
setInterval(loadTasks, 8000);
setInterval(renderSync, 1000);
</script>
</body>
</html>
