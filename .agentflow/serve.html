<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentflow viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262a33; --text:#e6e8ec; --muted:#9aa3b2; --accent:#4c9be8; --ok:#48b06b; --warn:#e8a13b; --bad:#e0607e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--muted); font-size:13px; }
  .layout { display:grid; grid-template-columns: 300px 1fr; height: calc(100vh - 52px); }
  aside { border-right:1px solid var(--border); overflow:auto; padding:12px; }
  main { overflow:auto; padding:20px; }
  .section-title { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.08em; margin:14px 0 6px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
  .task { cursor:pointer; }
  .task:hover { border-color:var(--accent); }
  .task .row { display:flex; justify-content:space-between; align-items:center; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
  .status-pending { color:var(--muted); }
  .status-in_progress { color:var(--accent); }
  .status-review { color:var(--warn); }
  .status-completed { color:var(--ok); }
  .status-blocked { color:var(--bad); }
  .status-reopened { color:var(--warn); }
  .muted { color:var(--muted); font-size:13px; }
  .kv { display:grid; grid-template-columns: 160px 1fr; gap:4px 12px; font-size:13px; }
  .kv div:nth-child(odd) { color:var(--muted); }
  .open-item { background:#1e2230; border:1px solid var(--border); border-radius:6px; padding:8px; margin:6px 0; font-size:13px; }
  .open-item .id { color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { padding:6px 12px; border:1px solid var(--border); border-radius:6px; cursor:pointer; background:var(--panel); }
  .tab.active { border-color:var(--accent); color:var(--accent); }
  .spinner { color:var(--muted); font-style:italic; }
  .empty { color:var(--muted); font-style:italic; padding:20px; text-align:center; }
  pre { background:#0b0d11; border:1px solid var(--border); border-radius:6px; padding:10px; overflow:auto; font-size:12px; }
  .history-link { color:var(--accent); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>agentflow</h1>
  <span class="sub">read-only viewer · .agent state</span>
</header>
<div class="layout">
  <aside>
    <div class="section-title">Navigation</div>
    <div class="tabs" style="flex-direction:column; gap:4px;">
      <div class="tab active" data-view="dashboard">Dashboard</div>
      <div class="tab" data-view="models">Models</div>
      <div class="tab" data-view="knowledge">Knowledge</div>
      <div class="tab" data-view="history">History</div>
    </div>
    <div class="section-title">Running tasks</div>
    <div id="running-tasks"><span class="spinner">loading…</span></div>
  </aside>
  <main id="main"><span class="spinner">loading…</span></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
let currentView = "dashboard";
let selectedTask = null;
let tasksCache = [];

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

function statusClass(s){ return "status-" + (s||"").replace(/[^a-z_]/g,""); }

function renderRunningTasks() {
  const el = document.getElementById("running-tasks");
  const running = tasksCache.filter(t => t && t.status !== "completed");
  if (!running.length) { el.innerHTML = '<div class="empty">no running tasks</div>'; return; }
  el.innerHTML = running.map(t => `
    <div class="card task" data-id="${t.task_id}">
      <div class="row">
        <strong>${t.task_id}</strong>
        <span class="badge ${statusClass(t.status)}">${t.status}</span>
      </div>
      <div class="muted">${t.size||""} · plan ${t.plan_required?"required":"not required"}</div>
    </div>
  `).join("");
  el.querySelectorAll(".task").forEach(n => n.addEventListener("click", () => selectTask(n.dataset.id)));
}

async function loadTasks() {
  const data = await api("/api/tasks");
  const list = Array.isArray(data.tasks) ? data.tasks : (Array.isArray(data) ? data : []);
  tasksCache = list;
  renderRunningTasks();
  if (currentView === "dashboard" && !selectedTask) renderDashboard();
}

async function selectTask(id) {
  selectedTask = id;
  const data = await api("/api/task/" + encodeURIComponent(id));
  renderTaskDetail(data);
}

function renderDashboard() {
  const main = document.getElementById("main");
  const running = tasksCache.filter(t => t && t.status !== "completed");
  const completed = tasksCache.filter(t => t && t.status === "completed");
  main.innerHTML = `
    <h2>Dashboard</h2>
    <div class="card">
      <div class="kv">
        <div>Total tasks</div><div>${tasksCache.length}</div>
        <div>Running</div><div>${running.length}</div>
        <div>Completed</div><div>${completed.length}</div>
      </div>
    </div>
    <div class="section-title">Running tasks (click to expand)</div>
    ${running.length ? running.map(t => `
      <div class="card task" data-id="${t.task_id}">
        <div class="row"><strong>${t.task_id}</strong><span class="badge ${statusClass(t.status)}">${t.status}</span></div>
        <div class="muted">${t.size||""}</div>
      </div>
    `).join("") : '<div class="empty">no running tasks</div>'}
  `;
  main.querySelectorAll(".task").forEach(n => n.addEventListener("click", () => selectTask(n.dataset.id)));
}

function renderTaskDetail(data) {
  const main = document.getElementById("main");
  if (!data || data.ok === false) {
    main.innerHTML = `<div class="card"><strong>Error</strong><pre>${JSON.stringify(data,null,2)}</pre></div>`;
    return;
  }
  const openItems = Array.isArray(data.open_items) ? data.open_items : [];
  const counters = data.counters || {};
  main.innerHTML = `
    <div class="history-link" id="back">← back to dashboard</div>
    <h2>${data.task_id}</h2>
    <div class="card">
      <div class="kv">
        <div>Status</div><div><span class="badge ${statusClass(data.status)}">${data.status}</span></div>
        <div>Size</div><div>${data.size}</div>
        <div>Plan required</div><div>${data.plan_required}</div>
        <div>Next action</div><div>${data.next_action || "—"}</div>
        <div>Open discrepancies</div><div>${(data.open_discrepancies||[]).length}</div>
        <div>Verify commands</div><div>${(data.verify_commands||[]).join(", ") || "—"}</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Counters</div>
      <div class="kv">
        <div>Attempts</div><div>${counters.attempts_total}/${counters.max_attempts}</div>
        <div>Spawn depth</div><div>${counters.spawn_depth}/${counters.max_spawn_depth}</div>
        <div>Children</div><div>${counters.children}/${counters.max_children}</div>
      </div>
    </div>
    <div class="section-title">Open items (${openItems.length})</div>
    ${openItems.length ? openItems.map(i => `<div class="open-item"><span class="id">${i}</span></div>`).join("") : '<div class="empty">no open items</div>'}
    <div class="section-title">Knowledge refs</div>
    <div class="muted">${(data.knowledge_refs||[]).join(", ") || "—"}</div>
    ${data.budget ? `<div class="card"><div class="section-title" style="margin-top:0">Budget</div><div class="kv">
      <div>Present</div><div>${data.budget.present}</div>
      <div>Exceeded</div><div>${(data.budget.exceeded||[]).length}</div>
      <div>Warned</div><div>${(data.budget.warned||[]).length}</div>
    </div></div>` : ""}
  `;
  document.getElementById("back").addEventListener("click", () => { selectedTask=null; renderDashboard(); });
}

async function renderModels() {
  const data = await api("/api/models");
  const cfg = data.config || {};
  const st = data.state || {};
  const roles = (cfg.adapters && cfg.adapters.opencode && cfg.adapters.opencode.roles) || {};
  let html = "<h2>Models</h2>";
  html += "<div class='card'><table><tr><th>Role</th><th>Paid chain</th><th>Free chain</th></tr>";
  for (const [role, info] of Object.entries(roles)) {
    html += `<tr><td>${role}</td><td>${(info.paid||[]).join("<br>")}</td><td>${(info.free||[]).join("<br>")}</td></tr>`;
  }
  html += "</table></div>";
  if (st.roles) {
    html += "<div class='section-title'>State pointers</div><div class='card'><table><tr><th>Role</th><th>Tier</th><th>Index</th><th>Switched</th></tr>";
    for (const [k, v] of Object.entries(st.roles)) {
      if (!k.startsWith("opencode:")) continue;
      html += `<tr><td>${k.replace("opencode:","")}</td><td>${v.tier}</td><td>${v.index}</td><td>${v.switched_count}</td></tr>`;
    }
    html += "</table></div>";
  }
  document.getElementById("main").innerHTML = html;
}

async function renderKnowledge() {
  const data = await api("/api/knowledge");
  let html = "<h2>Knowledge</h2>";
  if (data && Array.isArray(data.entries)) {
    html += "<div class='card'><table><tr><th>ID</th><th>Status</th><th>Scope</th></tr>";
    for (const e of data.entries) {
      html += `<tr><td>${e.id||""}</td><td>${e.status||""}</td><td>${(e.scope||[]).join(", ")}</td></tr>`;
    }
    html += "</table></div>";
  } else {
    html += "<div class='card'><pre>" + JSON.stringify(data,null,2) + "</pre></div>";
  }
  document.getElementById("main").innerHTML = html;
}

async function renderHistory() {
  const data = await api("/api/history");
  const tasks = data.tasks || [];
  let html = "<h2>Task history (completed, newest first)</h2>";
  if (!tasks.length) { html += '<div class="empty">no completed tasks</div>'; }
  else {
    html += "<div class='card'><table><tr><th>Task ID</th><th>Status</th><th>Size</th><th>Updated</th></tr>";
    for (const t of tasks) {
      html += `<tr><td class="history-link" data-id="${t.task_id}">${t.task_id}</td><td>${t.status}</td><td>${t.size||""}</td><td>${t.updated_at||""}</td></tr>`;
    }
    html += "</table></div>";
  }
  document.getElementById("main").innerHTML = html;
  document.getElementById("main").querySelectorAll(".history-link").forEach(n => n.addEventListener("click", () => selectTask(n.dataset.id)));
}

function switchView(view) {
  currentView = view;
  selectedTask = null;
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  if (view === "dashboard") renderDashboard();
  else if (view === "models") renderModels();
  else if (view === "knowledge") renderKnowledge();
  else if (view === "history") renderHistory();
}

$$(".tab").forEach(t => t.addEventListener("click", () => switchView(t.dataset.view)));

loadTasks().then(() => { if (!selectedTask) renderDashboard(); });
setInterval(loadTasks, 8000);
</script>
</body>
</html>
